name: Manual offline and isolated validation
on:
  workflow_dispatch:
    inputs:
      container:
        description: Also build and run the isolated synthetic container suite
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.15'
      - name: Public packaging and vendor checks
        run: |
          python3 scripts/verify_public.py
          python3 scripts/verify_source.py
      - name: Offline regression suite
        run: python3 scripts/test_offline.py
      - name: Isolated synthetic build and container suite
        if: inputs.container
        run: sh scripts/build.sh
