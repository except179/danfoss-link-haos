name: Bug report
description: Report incorrect behavior with sanitized reproduction.
title: "[Bug report]: "
body:
  - type: markdown
    attributes:
      value: >-
        Do not upload passwords, MQTT credentials, tokens, pairing codes/identities,
        private certificates/keys, fingerprints, backups, raw production logs, private
        network configuration, room names/readings or identifying screenshots. Only
        short reviewed/redacted excerpts are appropriate. For vulnerabilities, follow
        SECURITY.md rather than disclosing details here.
  - type: input
    id: versions
    attributes:
      label: App and Home Assistant versions
      description: App, HAOS, Core, Supervisor and CPU architecture, if known. No hostnames or addresses.
    validations:
      required: true
  - type: input
    id: controller
    attributes:
      label: Controller model and firmware
      description: Model and firmware if known; do not include serial numbers or controller IDs.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and checks already tried
      description: Safe steps only. Do not reset, re-pair, change heating or interrupt a broker to fill this form.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional sanitized log excerpt or screenshot
      description: Review every line/pixel and image metadata first. No certificates, secrets, backups or household/network identifiers.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy review
      options:
        - label: I removed private information and am not reporting a vulnerability publicly.
          required: true
